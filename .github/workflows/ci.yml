name: CI

on:
  push:
    branches: [main]
  pull_request:

# The test suite mocks all HTTP — no live network is required or used.
jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          pip install 'ruff==0.15.14'

      - name: Lint
        run: ruff check .

      - name: Test (offline, mocked)
        run: pytest -q
